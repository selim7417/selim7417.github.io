<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Dental Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#03060b; --ink:#eee8dd; --ink-2:#a6afbc; --ink-3:#6c7787;
  --line:rgba(238,232,221,.10); --line-2:rgba(238,232,221,.22);
  --glass:rgba(10,16,26,.6); --glass-2:rgba(16,25,40,.76);
  --time:#ffb547; --scan:#7fd3ff; --accent:#8fd9cf;
  --disp:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#03060b; --ink:#eee8dd; --glass:rgba(10,16,26,.6); --glass-2:rgba(16,25,40,.76); } }
:root[data-theme="dark"]{ --bg:#03060b; --ink:#eee8dd; --glass:rgba(10,16,26,.6); --glass-2:rgba(16,25,40,.76); }
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ui{opacity:0;transition:opacity 1.2s var(--ease)}
body.ready .ui{opacity:1}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}

/* header */
#when{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);left:30px}
.who{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}
.who b{font-family:var(--disp);font-weight:400;font-size:24px;color:var(--ink)}
.allergy{font-size:12px;padding:3px 9px;border-radius:999px;color:#ffc2cc;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.35)}
.date{font-family:var(--disp);font-weight:300;font-size:64px;line-height:.95;letter-spacing:-.02em;margin-top:10px;font-variant-numeric:tabular-nums}
.date .yr{color:var(--time)}
.sub{font-size:13px;color:var(--ink-2);margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sub b{color:var(--ink);font-weight:500}
.future{font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--time);color:var(--time);display:none}
.future.on{display:inline-block}
.back{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--time);background:rgba(255,181,71,.14);color:var(--ink);font-size:13px;font-weight:500;box-shadow:0 0 24px rgba(255,181,71,.18)}
.back::before{content:"";width:7px;height:7px;border-left:1.5px solid var(--time);border-bottom:1.5px solid var(--time);transform:rotate(45deg);margin-left:2px}
.back:hover{background:rgba(255,181,71,.24)}
.back[hidden]{display:none}

/* tools */
#tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);right:30px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink-2);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:rgba(238,232,221,.13);color:var(--ink)}
.seg button:hover{color:var(--ink)}
.tog{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:9px 14px;border-radius:12px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tog:hover{color:var(--ink)}
.tog[aria-pressed="true"]{color:var(--ink);border-color:rgba(127,211,255,.55);background:rgba(40,110,160,.28)}
.tog .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.tog[aria-pressed="true"] .dot{background:var(--scan);box-shadow:0 0 10px var(--scan)}
.slider{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;font-size:13px;color:var(--ink-2);transition:opacity .3s}
.slider input{width:110px;accent-color:#7fd3ff}
.slider.off{opacity:0;pointer-events:none}

/* legend */
#legend{position:fixed;left:30px;top:50%;transform:translateY(-40%);display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:16px;min-width:200px}
#legend .lt{font-size:12px;color:var(--ink-3);padding:4px 8px 8px}
.lg{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 8px;border-radius:9px;text-align:left;color:var(--ink-2);font-size:13px}
.lg:hover{background:rgba(238,232,221,.06);color:var(--ink)}
.lg[aria-pressed="true"]{background:rgba(238,232,221,.1);color:var(--ink)}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.lg .ct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3)}

/* odontogram */
#odontogram{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);transform:translateX(-50%);padding:9px 11px;border-radius:16px;display:flex;flex-direction:column;gap:5px;max-width:calc(100vw - 24px);overflow-x:auto}
.og-row{display:flex;gap:3px}
.og-row .mid{width:10px;flex:none;position:relative}
.og-row .mid::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:var(--line-2)}
.og-t{width:28px;height:30px;flex:none;border:1px solid transparent;border-radius:8px;background:rgba(238,232,221,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);transition:background .2s,border-color .2s,opacity .3s}
.og-t i{width:6px;height:6px;border-radius:50%;background:var(--c);transition:background .4s}
.og-t.missing{color:var(--ink-3)}
.og-t.missing i{background:transparent;border:1px solid #6f7d93}
.og-t:hover,.og-t.hov{background:rgba(238,232,221,.09);color:var(--ink)}
.og-t.sel{border-color:var(--c);color:var(--ink);background:rgba(238,232,221,.1)}
.og-t.dim{opacity:.3}

/* timeline */
#timeline{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);width:min(1100px,calc(100vw - 40px));padding:12px 18px 12px 12px;border-radius:20px;display:flex;align-items:center;gap:16px}
#play{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--time);color:#1b1206;display:flex;align-items:center;justify-content:center}
#play:hover{transform:scale(1.05)}
#play.pulse{animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}100%{box-shadow:0 0 0 18px rgba(255,181,71,0)}}
#play svg{width:20px;height:20px}
.trackwrap{flex:1;position:relative;height:54px}
.track{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line-2);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--time);border-radius:2px}
.fut{position:absolute;top:-6px;bottom:-6px;right:0;background:repeating-linear-gradient(135deg,rgba(255,181,71,.16) 0 4px,transparent 4px 9px);border-left:1px dashed rgba(255,181,71,.6)}
.yr-t{position:absolute;top:35px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;pointer-events:none}
.yr-t::before{content:"";position:absolute;left:50%;top:-11px;width:1px;height:6px;background:var(--line-2)}
.ev{position:absolute;top:23px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c);border:2px solid var(--bg);padding:0;z-index:2;transition:transform .2s}
.ev:hover{transform:scale(1.5)}
.ev.plan{background:transparent;border:1.5px dashed var(--c)}
.ev.past{box-shadow:0 0 10px var(--c)}
.today{position:absolute;top:-4px;transform:translateX(-50%);font-size:11px;color:var(--time);pointer-events:none}
.head{position:absolute;top:23px;width:4px;height:26px;margin:-13px 0 0 -2px;border-radius:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8);z-index:3;pointer-events:none}
#scrub{position:absolute;left:-8px;right:-8px;top:8px;height:30px;margin:0;opacity:0;cursor:ew-resize;z-index:1}
.tl-side{flex:none;display:flex;flex-direction:column;gap:6px}
.tl-side button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 12px;font-size:12px;color:var(--ink-2)}
.tl-side button:hover{color:var(--ink);border-color:var(--line-2)}

/* caption + hint */
#caption{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);transform:translate(-50%,-14px);min-width:320px;max-width:min(440px,calc(100vw - 32px));padding:16px 20px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .5s var(--ease),transform .6s var(--ease);z-index:5}
#caption.on{opacity:1;transform:translate(-50%,0)}
#caption .cd{font-family:var(--disp);font-size:21px;color:var(--time)}
#caption .cd em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:8px}
.ce{display:flex;gap:14px;align-items:baseline;margin-top:9px}
.ce .tn{font-family:var(--disp);font-size:28px;line-height:1;color:var(--c);min-width:40px}
.ce .ts{font-size:12px;color:var(--ink-3);margin-top:3px}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 34px);transform:translateX(-50%);font-size:13px;color:var(--ink-2);pointer-events:none;transition:opacity .6s;text-align:center}
body.ready #hint.gone{opacity:0}

/* labels (panoramic) */
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lb .f{font-size:11px;color:var(--c);margin-top:1px}

/* panel */
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 118px);right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);width:min(380px,calc(100vw - 32px));border-radius:22px;background:var(--glass-2);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .7s var(--ease);z-index:4;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#panel.open{transform:none}
.pb{overflow-y:auto;padding:22px 22px 16px;flex:1}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(238,232,221,.04);font-size:17px;color:var(--ink-2)}
.x:hover{color:var(--ink)}
.t-head{display:flex;align-items:flex-end;gap:14px;padding-right:40px}
.t-num{font-family:var(--disp);font-weight:300;font-size:80px;line-height:.8;letter-spacing:-.03em;color:var(--c);text-shadow:0 0 40px color-mix(in srgb,var(--c) 45%,transparent)}
.t-name{font-family:var(--disp);font-size:22px;line-height:1.1}
.t-alt{color:var(--ink-3);font-size:12px;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;font-size:12px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.readout div{background:rgba(6,11,19,.85);padding:9px 12px}
.readout span{display:block;font-size:11px;color:var(--ink-3)}
.readout b{font-weight:500;font-size:14px}
.surf{display:flex;align-items:center;gap:16px;margin-top:14px;padding:14px;border-radius:14px;background:rgba(238,232,221,.035);border:1px solid var(--line)}
.surf p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5}
.surf p b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.sec{font-size:12px;font-weight:500;color:var(--ink-3);margin:22px 0 10px}
.plan{padding:12px 14px;border-radius:14px;border:1px dashed rgba(255,181,71,.6);background:rgba(255,181,71,.07)}
.plan .d{color:var(--time);font-size:12px}
.plan .p{margin-top:3px}
.hl{list-style:none;margin:0;padding:0}
.hl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);transition:opacity .3s}
.hl li.later{opacity:.4}
.hl i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.hl li.pl i{background:transparent;border:1.5px dashed var(--c)}
.hl .d{font-size:12px;color:var(--ink-3)}
.hl .p{margin-top:2px}
.hl .n{font-size:12px;color:var(--ink-3);margin-top:2px}
.hl button{border:0;background:none;padding:0;color:var(--time);font-size:12px;margin-top:4px}
.empty{color:var(--ink-2);font-size:13px;line-height:1.5}
.pa{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.pa button{border:1px solid var(--line);background:rgba(238,232,221,.04);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.pa button:hover{color:var(--ink)}
.pa .primary{flex:1;background:var(--ink);color:#0a0f17;border-color:var(--ink);font-weight:500}
.pa .primary:hover{background:#fff;color:#0a0f17}

#tip{position:fixed;left:0;top:0;pointer-events:none;padding:9px 12px;border-radius:11px;font-size:13px;white-space:nowrap;opacity:0;transform:translate(14px,14px);transition:opacity .15s;z-index:6}
#tip.on{opacity:1}
#tip b{font-family:var(--disp);font-weight:400;font-size:20px;margin-right:8px}
#tip small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);transform:translate(-50%,-16px);padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s var(--ease);z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;transition:opacity 1.2s}
#loader.gone{opacity:0;pointer-events:none}
#loader .t{font-family:var(--disp);font-size:28px}
#loader .err{color:#ffb3c0;max-width:340px;text-align:center;line-height:1.5}

@media (max-width:1250px){ #legend{display:none} }
@media (max-width:1000px){ .date{font-size:44px} #odontogram{display:none} #panel{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)} }
@media (max-width:760px){
  #when{left:16px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .who b{font-size:20px}
  .date{font-size:36px}
  #tools{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);align-items:center;width:calc(100vw - 20px)}
  #tools .row{justify-content:center}
  .slider,[data-num]{display:none}
  #timeline{width:calc(100vw - 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:8px 12px 8px 8px;gap:10px}
  #play{width:42px;height:42px}
  .tl-side{display:none}
  .yr-t:nth-of-type(even){display:none}
  #panel{top:auto;left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:62%;transform:translateY(calc(100% + 40px))}
  #panel.open{transform:none}
  #hint,#labels{display:none}
  #caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms!important;animation:none!important} }
</style>
</head>
<body>
<div id="stage" aria-label="Interactive 3D dental chart with treatment history"></div>
<div id="labels" aria-hidden="true"></div>
<div id="loader"><div class="t">Loading dental chart</div></div>

<header id="when" class="ui">
  <div class="who"><b>Selim Fata</b><span>PT-20418</span><span class="allergy">Penicillin allergy</span></div>
  <div class="date" id="dateLabel" aria-live="polite"></div>
  <div class="sub"><span id="ageLabel"></span><span id="summary"></span><span class="future" id="futureTag">Planned treatment</span></div>
  <button class="back" id="backBtn" hidden>Back to today's chart</button>
</header>

<div id="tools" class="ui">
  <div class="row">
    <div class="seg glass" role="group" aria-label="Layout"><button data-layout="arch" aria-pressed="true">3D arch</button><button data-layout="pano" aria-pressed="false">Panoramic</button></div>
    <div class="seg glass" role="group" aria-label="Jaw"><button data-view="full" aria-pressed="true">Both</button><button data-view="upper" aria-pressed="false">Upper</button><button data-view="lower" aria-pressed="false">Lower</button></div>
  </div>
  <div class="row">
    <label class="slider glass off" id="contrastWrap">Contrast <input id="contrast" type="range" min="0.5" max="1.8" step="0.01" value="1"></label>
    <button class="tog" id="xrayBtn" aria-pressed="false"><span class="dot"></span>X-ray</button>
    <button class="tog" id="rotBtn" aria-pressed="true"><span class="dot"></span>Rotate</button>
    <div class="seg glass" role="group" aria-label="Numbering"><button data-num="fdi" aria-pressed="true">FDI</button><button data-num="uni" aria-pressed="false">Universal</button></div>
  </div>
</div>

<nav id="legend" class="ui glass" aria-label="Filter teeth by condition"><div class="lt">Show teeth with</div></nav>
<div id="odontogram" class="ui glass" aria-label="Tooth selector"></div>
<div id="hint" class="ui">Click a tooth to open it. Press play to watch ten years of treatment.</div>
<div id="caption" class="glass" aria-live="polite"></div>

<div id="timeline" class="ui glass">
  <button id="play" class="pulse" aria-label="Play treatment history"></button>
  <div class="trackwrap" id="trackwrap">
    <div class="track"><div class="fill" id="fill"></div><div class="fut" id="fut"></div></div>
    <input id="scrub" type="range" min="0" max="1000" step="1" aria-label="Date on the timeline">
    <div class="head" id="head"></div>
  </div>
  <div class="tl-side"><button id="toStart">Start</button><button id="toToday">Today</button></div>
</div>

<aside id="panel" aria-hidden="true" aria-label="Tooth details">
  <button class="x" id="pnClose" aria-label="Close tooth details">×</button>
  <div class="pb" id="pnBody"></div>
  <div class="pa"><button id="pnPrev" aria-label="Previous tooth">Previous</button><button class="primary" id="pnAdd">Add procedure</button><button id="pnNext" aria-label="Next tooth">Next</button></div>
</aside>
<div id="tip" class="glass"></div>
<div id="toast" class="glass"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script id="app">
(function(){
'use strict';
const loader=document.getElementById('loader');
function fail(m){loader.innerHTML='<div class="t">Chart unavailable</div><div class="err">'+m+'</div>';}
if(!window.THREE||!THREE.OrbitControls){fail('The 3D engine did not load. Check the internet connection and reload the page.');return;}

/* geometry */
function finalize(g){
 if(g.attributes.normal)g.deleteAttribute('normal');
 if(g.attributes.uv)g.deleteAttribute('uv');
 if(THREE.BufferGeometryUtils&&THREE.BufferGeometryUtils.mergeVertices)g=THREE.BufferGeometryUtils.mergeVertices(g,1e-4);
 g.computeVertexNormals();return g;
}
function neck(T){return{nx:.7*(T.group==='incisor'?.78:T.group==='canine'?.85:1)*T.w/2,nz:.7*T.d/2};}

function crownGeo(T,ms){
 const g=new THREE.SphereGeometry(1,112,84),P=g.attributes.position,G=T.group;
 const e2=G==='molar'?.5:G==='premolar'?.72:.85, e1=G==='molar'?.5:G==='premolar'?.55:.62;
 for(let i=0;i<P.count;i++){
  const x=P.getX(i),y=P.getY(i),z=P.getZ(i);
  const lat=Math.asin(clamp(y,-1,1)),lon=Math.atan2(z,x),cl=Math.cos(lat),sl=Math.sin(lat);
  const X=sp(cl,e1)*sp(Math.cos(lon),e2),Y=sp(sl,e1),Z=sp(cl,e1)*sp(Math.sin(lon),e2);
  const f=Y<0?1-.3*Math.pow(-Y,1.5):1-.07*Y*Y;
  let xs=1,zs=1;
  if(G==='incisor'){zs=lerp(1,.26,smooth(-.4,1,Y));xs=lerp(.78,1.04,smooth(-1,.7,Y));}
  else if(G==='canine'){zs=lerp(1,.5,smooth(-.3,1,Y));xs=lerp(.85,1,smooth(-1,.3,Y));}
  const Xm=X*ms,w=smooth(.35,.97,Y);let hA=0;
  if(G==='molar'){
   for(const c of T.cusps){const dx=Xm-c[0],dz=Z-c[1];hA+=c[2]*Math.exp(-(dx*dx+dz*dz)/.1);}
   hA-=.13;
   hA-=.06*Math.exp(-(Z*Z)/.01)*(1-Math.pow(Math.abs(X),6));
   hA-=.04*Math.exp(-(Xm*Xm)/.01)*(1-Math.pow(Math.abs(Z),6));
  }else if(G==='premolar'){
   hA+=.26*Math.exp(-(X*X/.25+(Z-.42)*(Z-.42)/.08))+.16*Math.exp(-(X*X/.25+(Z+.42)*(Z+.42)/.08));
   hA-=.08+.07*Math.exp(-Z*Z/.012);
  }else if(G==='canine'){hA+=.42*Math.max(0,1-Math.abs(X)*1.25)-.12;}
  else{hA+=.018*Math.cos(X*10)-.02*X*X;}
  const px=X*xs*f*T.w/2;
  let pz=Z*zs*f*T.d/2;
  if(G==='incisor'||G==='canine')pz-=.1*T.d*X*X*(.5+.5*Y);
  const py=(Y+1)/2*T.h+hA*w*T.h*.5;
  P.setXYZ(i,px,py,pz);
 }
 return finalize(g);
}

function rootSpecs(T,ms){

 switch(T.roots){
  case 'bl2':return[{bx:0,bz:nz*.45,sx:0,sz:.07,rx:nx*.8,rz:nz*.5,len:L*.95},{bx:0,bz:-nz*.45,sx:0,sz:-.07,rx:nx*.75,rz:nz*.48,len:L*.9}];
  case 'upper3':return[
   {bx:ms*nx*.5,bz:nz*.45,sx:ms*.14,sz:.1,rx:nx*.42,rz:nz*.42,len:L*.92},
   {bx:-ms*nx*.5,bz:nz*.45,sx:-ms*.12,sz:.1,rx:nx*.38,rz:nz*.38,len:L*.86},
   {bx:0,bz:-nz*.5,sx:0,sz:-.18,rx:nx*.46,rz:nz*.46,len:L*1.02}];
  case 'lower2':return[
   {bx:ms*nx*.5,bz:0,sx:ms*.1,sz:0,rx:nx*.4,rz:nz*.85,len:L},
   {bx:-ms*nx*.5,bz:0,sx:-ms*.12,sz:0,rx:nx*.36,rz:nz*.8,len:L*.92}];
  default:return[{bx:0,bz:0,sx:0,sz:0,rx:nx*.95,rz:nz*.95,len:L}];
 }
}
function rootCenter(R,t,ms){const e=Math.pow(t,1.4);return{x:R.bx+R.sx*e-ms*.07*R.len*t*t,z:R.bz+R.sz*e};}
function rootGeo(R,ms){
 const pts=[],N=44;
 for(let k=N;k>=0;k--){const t=k/N;const r=t>=1?0:(1-.42*t)*Math.pow(1-t,.32);pts.push(new THREE.Vector2(r,-t*R.len));}
 pts.push(new THREE.Vector2(.95,.25));
 const g=new THREE.LatheGeometry(pts,40),P=g.attributes.position;
 for(let i=0;i<P.count;i++){const x=P.getX(i),y=P.getY(i),z=P.getZ(i),t=clamp(-y/R.len,0,1),c=rootCenter(R,t,ms);P.setXYZ(i,x*R.rx+c.x,y,z*R.rz+c.z);}
 return finalize(g);
}
function implantGeo(T){
 const{nx,nz}=neck(T),L=T.root*.85,r0=Math.min(nx,nz)*.78,pts=[],N=200;
 for(let k=N;k>=0;k--){const t=k/N;const base=r0*(1-.25*t);const ap=t>.94?Math.sqrt(Math.max(0,1-Math.pow((t-.94)/.06,2))):1;const th=.028*Math.abs(((t*L/.075)%1)*2-1);pts.push(new THREE.Vector2(Math.max(0,(base-th)*ap),-t*L));}
 pts.push(new THREE.Vector2(r0*1.05,.02));
 return finalize(new THREE.LatheGeometry(pts,48));
}

  t.lb.style.setProperty('--c',col);t.lb.querySelector('.f').textContent=s.primary==='healthy'?'':ST[s.primary].l;});
 lg.querySelectorAll('.lg').forEach(b=>b.querySelector('.ct').textContent=counts[b.dataset.s]);
 const present=32-counts.missing,treated=teeth.filter(t=>t.st.tags.some(k=>['filling','crown','rct','implant'].includes(k))).length;
 $('summary').innerHTML='<b>'+present+'</b> teeth, <b>'+treated+'</b> treated, <b>'+counts.caries+'</b> need treatment';
 updateTargets();
 if(selected)renderPanel(selected);
 if($('backBtn'))updateBack();
}
function updateTargets(){teeth.forEach(t=>{let o=1;
 if(view==='upper'&&!t.upper)o=.06;if(view==='lower'&&t.upper)o=.06;
 if(filter&&t.st&&!t.st.tags.includes(filter))o=Math.min(o,.1);
 if(selected&&selected!==t)o=Math.min(o,.08);
 t.tOp=o;t.btn.classList.toggle('dim',o<.5&&selected!==t);t.btn.classList.toggle('sel',selected===t);});}

// caption
function showCaption(g){const plan=g.evs[0].plan;$('hint').classList.add('gone');
 $('caption').innerHTML='<div class="cd">'+fmtLong(g.day)+(plan?'<em>Planned</em>':'')+'</div>'+g.evs.map(e=>{const t=byFdi[e.f];return'<div class="ce" style="--c:'+KIND[e.k].c+'"><div class="tn">'+num(t)+'</div><div><div>'+e.p+'</div><div class="ts">'+cap(t.name)+', '+e.dr+'</div></div></div>';}).join('');
 $('caption').classList.add('on');}
function hideCaption(){$('caption').classList.remove('on');}

// play
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const playBtn=$('play');playBtn.innerHTML=ICON_PLAY;
function stop(){if(!playing)return;playing=false;seg=null;playBtn.innerHTML=ICON_PLAY;playBtn.setAttribute('aria-label','Play treatment history');updateBack();}
function updateBack(){$('backBtn').hidden=!(playing||Math.abs(T-TODAY)>.5);}
function backToToday(){stop();hideCaption();if(selected)deselect(true);lastDay=TODAY;setT(TODAY);filter=null;lg.querySelectorAll('.lg').forEach(x=>x.setAttribute('aria-pressed','false'));setView('full');updateTargets();flyHome(1.4);updateBack();}
function play(){playBtn.classList.remove('pulse');$('hint').classList.add('gone');if(selected)deselect(true);
 if(T>=TODAY-1){setT(TMIN);lastDay=TMIN;}
 playing=true;playBtn.innerHTML=ICON_PAUSE;playBtn.setAttribute('aria-label','Pause');hideCaption();updateBack();nextSeg();}
$('backBtn').onclick=backToToday;
playBtn.onclick=()=>playing?stop():play();
function nextSeg(){const now=performance.now()/1000,g=GROUPS.find(x=>x.day>T+.5);
 if(!g){seg={from:T,to:Math.max(T,TODAY),s:now,d:1,end:true};hideCaption();flyHome();return;}
 const d=clamp((g.day-T)/420,.6,1.7);seg={from:T,to:g.day,s:now,d,g};hideCaption();
 const pose=toothPose(g.evs.map(e=>byFdi[e.f]),false);flyTo(pose.p,pose.t,d+.25);}
function jumpTo(g){if(selected)deselect(true);setT(g.day-60);lastDay=g.day-60;setT(g.day);showCaption(g);const pose=toothPose(g.evs.map(e=>byFdi[e.f]),false);flyTo(pose.p,pose.t,1.3);}

// tools
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{if(layout===b.dataset.layout)return;layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
 lockAngles();if(selected){const p=focusPose(selected);viewOffT=p.off;flyTo(p.p,p.t,1.6);}else flyHome(1.8);});
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.view===v)));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{setView(b.dataset.view);if(selected)deselect(true);updateTargets();flyHome(1.6);});
$('xrayBtn').onclick=function(){xrayOn=!xrayOn;this.setAttribute('aria-pressed',String(xrayOn));$('contrastWrap').classList.toggle('off',!xrayOn);
 teeth.forEach(t=>Object.values(t.layers).forEach(L=>L.parts.forEach(p=>p.mesh.material=xrayOn?p.xray:p.normal)));};
$('contrast').oninput=e=>{U.uGain.value=+e.target.value;};
$('rotBtn').onclick=function(){autoRot=!autoRot;this.setAttribute('aria-pressed',String(autoRot));lastInteract=0;};
document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{numSys=b.dataset.num;document.querySelectorAll('[data-num]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));relabel();});

// panel
const SURF_FULL={O:'occlusal',I:'incisal',M:'mesial',D:'distal',B:'buccal',L:'lingual'};
function surfSVG(t,s){
 const ant=!(t.T.group==='molar'||t.T.group==='premolar'),C=ant?'I':'O',leftIs=t.sx<0?'D':'M',rightIs=t.sx<0?'M':'D';
 const fillOf=k=>{if(s.missing)return'none';if(s.implant)return ST.implant.c;if(s.crown)return ST.crown.c;if(s.carS.includes(k))return ST.caries.c;if(s.fillS.includes(k))return ST.filling.c;return'rgba(238,232,221,.06)';};
 const dash=s.missing?' stroke-dasharray="3 3"':'';
 const reg=[['B','10,10 110,10 80,40 40,40',60,29],['L','40,80 80,80 110,110 10,110',60,99],[leftIs,'10,10 40,40 40,80 10,110',24,64],[rightIs,'110,10 110,110 80,80 80,40',96,64]];
 let h='<svg width="92" height="92" viewBox="0 0 120 120" aria-hidden="true">';
 reg.forEach(([k,pts,lx,ly])=>{h+='<polygon points="'+pts+'" fill="'+fillOf(k)+'" fill-opacity=".75" stroke="rgba(238,232,221,.35)"'+dash+'/><text x="'+lx+'" y="'+ly+'" fill="#eee8dd" font-size="11" text-anchor="middle" font-family="Geist,sans-serif">'+k+'</text>';});
 h+='<rect x="40" y="40" width="40" height="40" fill="'+fillOf(C)+'" fill-opacity=".75" stroke="rgba(238,232,221,.35)"'+dash+'/><text x="60" y="64" fill="#eee8dd" font-size="11" text-anchor="middle" font-family="Geist,sans-serif">'+C+'</text></svg>';
 let txt;
 if(s.missing)txt='<b>Tooth not present</b>Extracted. See the history below.';
 else if(s.implant)txt=s.crown?'<b>Implant with crown</b>All surfaces restored.':'<b>Implant healing</b>Crown not placed yet.';
 else if(s.crown)txt='<b>Full coverage</b>'+(s.crown==='gold'?'Cast gold crown':'Zirconia crown')+' over all surfaces.';
 else if(s.fillS.length||s.carS.length)txt='<b>Treated surfaces</b>'+(s.fillS.length?'Filled: '+s.fillS.map(k=>SURF_FULL[k]).join(', ')+'. ':'')+(s.carS.length?'Decay: '+s.carS.map(k=>SURF_FULL[k]).join(', ')+'.':'');
 else txt='<b>Intact surfaces</b>No restorations or decay.';
 return'<div class="surf">'+h+'<p>'+txt+'</p></div>';
}
function renderPanel(t){
 const s=t.st,col=ST[s.primary].c,alt=numSys==='fdi'?'Universal '+t.uni:'FDI '+t.fdi;
 const roots=s.missing?'None':s.implant?'Implant':({single:'1',bl2:'2',upper3:'3',lower2:'2'})[t.T.roots];
 let h='<div class="t-head" style="--c:'+col+'"><div class="t-num">'+num(t)+'</div><div><div class="t-name">'+cap(t.name)+'</div><div class="t-alt">'+alt+'</div></div></div>';
 h+='<div class="chips">'+s.tags.map(k=>'<span class="chip" style="--c:'+ST[k].c+'"><i></i>'+ST[k].l+'</span>').join('')+'</div>';
 h+='<div class="readout"><div><span>Crown height</span><b>'+(t.T.h*10).toFixed(1)+' mm</b></div><div><span>Root length</span><b>'+(s.missing?'None':(t.T.root*10).toFixed(1)+' mm')+'</b></div><div><span>Roots</span><b>'+roots+'</b></div><div><span>Last treated</span><b>'+(s.last?fmtLong(s.last.day):'Never')+'</b></div></div>';
 h+=surfSVG(t,s);
 const nxt=t.evs.find(e=>e.day>T&&e.plan);
 if(nxt)h+='<h3 class="sec">Next appointment</h3><div class="plan"><div class="d">'+fmtLong(nxt.day)+'</div><div class="p">'+nxt.p+'</div></div>';
 h+='<h3 class="sec">Treatment history</h3>';
 if(!t.evs.length)h+='<p class="empty">No treatments in ten years. Checked at every exam, most recently on 27 Aug 2026.</p>';
 else h+='<ul class="hl">'+t.evs.map(e=>'<li class="'+(e.day>T?'later ':'')+(e.plan?'pl':'')+'" style="--c:'+KIND[e.k].c+'"><i></i><div><div class="d">'+fmtLong(e.day)+(e.plan?', planned':'')+'</div><div class="p">'+e.p+'</div><div class="n">'+e.n+' '+e.dr+'</div><button data-ev="'+e.id+'">Go to this date</button></div></li>').join('')+'</ul>';
 $('pnBody').innerHTML=h;
 $('pnBody').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{const e=EV[+b.dataset.ev];stop();setT(e.day-60);lastDay=e.day-60;setT(e.day);showCaption(GROUPS.find(x=>x.day===e.day));});
}
const panel=$('panel');
function select(t){stop();hideCaption();selected=t;$('hint').classList.add('gone');
 if((view==='upper'&&!t.upper)||(view==='lower'&&t.upper))setView('full');
 updateTargets();renderPanel(t);$('pnBody').scrollTop=0;panel.classList.add('open');panel.setAttribute('aria-hidden','false');lockAngles();
 const p=focusPose(t);viewOffT=p.off;flyTo(p.p,p.t,1.4);lastInteract=performance.now()/1000;}
function deselect(silent){selected=null;viewOffT={x:0,y:0};panel.classList.remove('open');panel.setAttribute('aria-hidden','true');updateTargets();lockAngles();if(!silent)flyHome(1.4);lastInteract=performance.now()/1000;}
function step(d){if(!selected)return;select(NAV[(NAV.indexOf(selected)+d+NAV.length)%NAV.length]);}
$('pnClose').onclick=()=>deselect();$('pnPrev').onclick=()=>step(-1);$('pnNext').onclick=()=>step(1);
let tt;$('pnAdd').onclick=()=>{if(!selected)return;const e=$('toast');e.textContent='In your app, this opens the procedure form for tooth '+num(selected)+'.';e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600);};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape'){if(selected)deselect();else if(playing||Math.abs(T-TODAY)>.5)backToToday();}if(selected&&e.key==='ArrowRight')step(1);if(selected&&e.key==='ArrowLeft')step(-1);if(e.key===' '&&e.target===document.body){e.preventDefault();playing?stop():play();}});

// pointer
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=$('tip'),cv=renderer.domElement;
let pDown=null,drag=false,pIn=false;
const live=()=>picks.filter(p=>p.userData.tooth.op>.3);
cv.addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);pIn=e.pointerType==='mouse';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';if(pDown&&Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y)>5)drag=true;});
cv.addEventListener('pointerleave',()=>{pIn=false;hovered=null;tip.classList.remove('on');});
cv.addEventListener('pointerdown',e=>{pDown={x:e.clientX,y:e.clientY};drag=false;tip.classList.remove('on');});
cv.addEventListener('pointerup',e=>{if(pDown&&!drag&&!tween){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(live(),false)[0];if(h)select(h.object.userData.tooth);else if(selected)deselect();}pDown=null;drag=false;});
controls.addEventListener('start',()=>{lastInteract=performance.now()/1000;$('hint').classList.add('gone');});
function hoverPick(){if(!pIn||pDown||tween)return;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(live(),false)[0];hovered=h?h.object.userData.tooth:null;cv.style.cursor=hovered?'pointer':'grab';
 if(hovered){tip.innerHTML='<b>'+num(hovered)+'</b>'+cap(hovered.name)+'<small>'+hovered.st.tags.map(k=>ST[k].l).join(', ')+'</small>';tip.classList.add('on');}else tip.classList.remove('on');}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(selected){const p=focusPose(selected);viewOffT=p.off;viewOff={...p.off};camera.position.copy(p.p);controls.target.copy(p.t);}renderer.setSize(innerWidth,innerHeight);if(composer){composer.setSize(innerWidth,innerHeight);fin.uniforms.uRes.value.set(innerWidth*dpr,innerHeight*dpr);}});

relabel();setT(TODAY);
teeth.forEach(t=>{Object.values(t.layers).forEach(L=>L.cur=L.tgt);t.glass=t.glassT;});

/* ---------- loop ---------- */
const clock=new THREE.Clock(),v3=new THREE.Vector3(),tmpN=new THREE.Vector3();let t0=0,started=false,xMix=0,scanX=-99;
function frame(){
 requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05),now=performance.now()/1000;
 if(!started){started=true;t0=now;loader.classList.add('gone');lastInteract=now;if(!reduced)flyTo(H0.p,H0.t,3.6,new THREE.Vector3(0,9,34));setTimeout(()=>document.body.classList.add('ready'),reduced?0:2100);}
 const it=reduced?99:now-t0;
 if(playing&&seg){
  if(seg.hold){if(now>seg.until)nextSeg();}
  else{const k=clamp((now-seg.s)/seg.d,0,1);setT(lerp(seg.from,seg.to,easeIO(k)));
   if(k>=1){if(seg.end)stop();else{showCaption(seg.g);seg={hold:true,until:now+(seg.g.evs.length>1?3.2:2.6)};}}}
 }
 if(tween){const k=clamp((now-tween.s)/tween.d,0,1),e=easeIO(k);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(k>=1){tween=null;controls.enabled=true;}}
 controls.autoRotate=autoRot&&layout==='arch'&&!playing&&!selected&&!tween&&now-lastInteract>6&&it>4;
 hoverPick();
 layoutMix+=(layoutTarget()-layoutMix)*Math.min(1,dt*(reduced?60:2.2));
 const lm=easeIO(clamp(layoutMix,0,1));
 // scan beam
 xMix+=((xrayOn?1:0)-xMix)*Math.min(1,dt*3);
 if(!reduced){const per=(2*XMAX+6)/2.6;scanX=selected?selected.outer.position.x+Math.sin(now*1.6)*1.2:-XMAX-3+((now%per)/per)*(2*XMAX+6);}
 U.uScan.value=reduced?-99:scanX;beam.position.set(scanX,0,lerp(0,.9,lm));beam.rotation.y=Math.atan2(camera.position.x-scanX,camera.position.z)*(1-lm);
 beam.material.uniforms.uA.value=(reduced?0:1)*xMix*(selected?.5:1);
 const a=Math.min(1,dt*6),la=Math.min(1,dt*3.2);
 teeth.forEach(t=>{
  const A=t.poses.arch,P=t.poses.pano;
  t.base.copy(A.pos).lerp(P.pos,lm);const rot=lerp(A.rot,P.rot,lm);t.N.set(Math.sin(rot),0,Math.cos(rot));
  t.outer.rotation.y=rot;t.tilt.rotation.x=lerp(A.tilt,P.tilt,lm);
  t.op+=(t.tOp-t.op)*a;t.glass+=(t.glassT-t.glass)*la;t.flash=Math.max(0,t.flash-dt*.7);
  const sel=selected===t;
  t.lift+=((sel?.55:hovered===t?.14:0)+t.flash*.35-t.lift)*a;
  t.hover+=((hovered===t||sel?1:0)-t.hover)*a;
  const tgt=t.base.clone().addScaledVector(t.N,t.lift);if(!reduced)tgt.y+=Math.sin(now*.8+t.phase)*.035;
  const p=clamp((it-t.delay)/1.9,0,1),e=easeOut(p);
  t.outer.position.lerpVectors(t.from,tgt,e);t.outer.visible=p>0;
  t.spin.rotation.x=(1-e)*t.rx;t.spin.rotation.z=(1-e)*t.rz;
  if(sel&&!reduced)t.spin.rotation.y+=dt*.45;else{let r=t.spin.rotation.y%(Math.PI*2);if(r>Math.PI)r-=Math.PI*2;if(r<-Math.PI)r+=Math.PI*2;t.spin.rotation.y=r*(1-a*.8);}
  const fade=t.op*Math.min(1,p*1.5);
  Object.entries(t.layers).forEach(([k,L])=>{L.cur+=(L.tgt-L.cur)*la;const g=(k==='roots'&&!xrayOn)?lerp(1,.3,t.glass):1;
   L.parts.forEach(q=>{const m=q.mesh.material,o=fade*L.cur*g;if(m.isShaderMaterial)m.uniforms.uOpacity.value=o;else{m.opacity=o;m.depthWrite=o>.97&&m.blending!==THREE.AdditiveBlending;}q.mesh.visible=o>.003;});});
  t.rings.forEach(r=>{r.mat.color.copy(r.col);let o=r.base*fade*(1+t.hover*.9+t.flash*2);if(r.pulse)o*=.6+.4*Math.sin(now*3.4);r.mat.opacity=Math.min(1,o);});
  t.pulse.forEach(m=>m.emissiveIntensity=.7+.6*Math.sin(now*3.4));
  if(t.btn)t.btn.classList.toggle('hov',hovered===t);
  // panoramic labels
  const lo=lm*(t.op>.3?1:0)*(selected?0:1)*(p>.9?1:0);
  if(lo>.02){v3.copy(t.outer.position);v3.y+=t.upper?(t.T.root+.45):-(t.T.root+.45);v3.project(camera);
   t.lb.style.transform='translate('+((v3.x*.5+.5)*innerWidth)+'px,'+((-v3.y*.5+.5)*innerHeight)+'px) translate(-50%,-50%)';}
  t.lb.style.opacity=lo;
 });
 // scanner rings
 const rv=selected?1:0;sMats.forEach((m,k)=>{m.opacity+=(rv*(.9-k*.2)-m.opacity)*a;});tickMat.opacity+=(rv*.8-tickMat.opacity)*a;
 if(selected){const s=selected;srings.position.copy(s.outer.position);srings.position.y+=(s.upper?-1:1)*(s.T.h-s.T.root)/2;
  const R=Math.max(s.T.w,s.T.d)*.85+.2,span=(s.T.h+s.T.root)*.5;
  srings.children.forEach((r,k)=>{if(r===ticks)return;r.scale.setScalar(R*(1+k*.08));r.position.y=reduced?0:Math.sin(now*1.3+k*2.1)*span;});
  ticks.scale.setScalar(R);ticks.rotation.y+=dt*.4;}
 for(let i=bursts.length-1;i>=0;i--){const b=bursts[i],k=(now-b.s)/1.4;if(k>=1){scene.remove(b.mesh);b.mesh.geometry.dispose();b.mesh.material.dispose();bursts.splice(i,1);continue;}b.mesh.scale.setScalar(.4+easeOut(k)*2.6);b.mesh.material.opacity=(1-k)*(1-k);}
 bg.material.uniforms.uX.value=xMix;
 pmat.color.copy(P_A).lerp(P_F,T>TODAY+1?1:0);
 platMats.forEach(m=>m.opacity=m.userData.o*(1-lm));
 particles.rotation.y+=dt*.012;platform.rotation.y-=dt*.03;
 const ko=Math.min(1,dt*3);viewOff.x+=(viewOffT.x-viewOff.x)*ko;viewOff.y+=(viewOffT.y-viewOff.y)*ko;
 if(Math.abs(viewOff.x)+Math.abs(viewOff.y)>.5)camera.setViewOffset(innerWidth,innerHeight,viewOff.x,viewOff.y,innerWidth,innerHeight);else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
 controls.update();
 if(composer){bloom.strength=.55+xMix*.45;fin.uniforms.uTime.value=now;fin.uniforms.uX.value=xMix;composer.render();}else renderer.render(scene,camera);
}
frame();
})();
</script>
